<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="refresh" content="0; url=daily_weekly_planner.html" />
  <title>FlowPlan — Daily, Weekly & Monthly Focus Planner</title>
  <link rel="icon" type="image/png" href="assets/speech-bubble.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FlowPlan" />
  <meta name="theme-color" content="#4f46e5" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #94a3b8;
      margin: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
  <script>
    // Seamless redirect preserving hash & query parameters
    window.location.replace("daily_weekly_planner.html" + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <div class="loader-wrap">
    <img src="assets/speech-bubble.png" alt="FlowPlan" class="app-icon" />
    <div class="spinner"></div>
    <p class="status-text">Opening FlowPlan...</p>
  </div>
</body>
</html>
